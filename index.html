<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Schnapp</title>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("schnapp-theme") || "system";
          var dark =
            pref === "dark" ||
            (pref !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.setAttribute("data-theme", "dark");
          else document.documentElement.removeAttribute("data-theme");
        } catch (_) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Sora:wght@500;600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/mock.css?v=20261001-field1" />
    <link rel="stylesheet" href="./css/nav-carousel.css?v=20261001-audit1" />
    <script type="importmap">
      {
        "imports": {
          "/engine/numbers/decimal.js": "/engine/numbers/decimal.js?v=20260930-ref1",
          "/engine/numbers/fraction.js": "/engine/numbers/fraction.js?v=20260930-ref1",
          "/engine/numbers/time.js": "/engine/numbers/time.js?v=20260930-ref1",
          "/engine/numbers/ordinal.js": "/engine/numbers/ordinal.js?v=20261001-ordam3",
          "/engine/numbers/date.js": "/engine/numbers/date.js?v=20261001-ordam3",
          "/engine/numbers/measure.js": "/engine/numbers/measure.js?v=20261001-meas1",
          "/engine/numbers/cardinal.js": "/engine/numbers/cardinal.js?v=20260930-ref1",
          "/engine/numbers/data.js": "/engine/numbers/data.js?v=20260930-ref1",
          "/engine/numbers/exercise.js": "/engine/numbers/exercise.js?v=20261001-meas1",
          "/engine/numbers/evaluate.js": "/engine/numbers/evaluate.js?v=20261001-meas1",
          "/engine/numbers/attempt.js": "/engine/numbers/attempt.js?v=20260930-ref1",
          "/engine/numbers/index.js": "/engine/numbers/index.js?v=20261001-meas1",
          "/engine/exercise/index.js": "/engine/exercise/index.js?v=20261001-richtig1",
          "/engine/exercise/create.js": "/engine/exercise/create.js?v=20261001-richtig1",
          "/engine/exercise/modes.js": "/engine/exercise/modes.js?v=20261001-imp1",
          "/engine/exercise/submit.js": "/engine/exercise/submit.js?v=20261001-imp1",
          "/engine/nouns/index.js": "/engine/nouns/index.js?v=20261001-richtig1",
          "/engine/nouns/categories.js": "/engine/nouns/categories.js?v=20261001-ctx1",
          "/engine/nouns/data.js": "/engine/nouns/data.js?v=20261001-imp1",
          "/engine/nouns/exercise.js": "/engine/nouns/exercise.js?v=20261001-richtig1",
          "/engine/nouns/category-practice.js": "/engine/nouns/category-practice.js?v=20261001-ctx1",
          "/engine/nouns/practice-compose.js": "/engine/nouns/practice-compose.js?v=20261001-ctx1",
          "/engine/nouns/context-compatibility.js": "/engine/nouns/context-compatibility.js?v=20261001-ctx1"
        }
      }
    </script>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="menu brand-menu">
          <button
            type="button"
            class="brand-menu-btn"
            id="brand-menu-btn"
            aria-expanded="false"
            aria-haspopup="true"
            aria-controls="brand-menu-panel"
          >
            <span class="brand-mark"
              >Schn<span class="brand-a">a</span><span class="brand-p1">p</span
              ><span class="brand-p2">p</span></span
            >
          </button>
          <div class="menu-panel" id="brand-menu-panel" role="menu" hidden>
            <button type="button" role="menuitem" data-nav="hub">Main menu</button>
            <button type="button" role="menuitem" id="btn-switch-user">
              Switch user
            </button>
            <hr class="menu-sep" />
            <button
              type="button"
              role="menuitemradio"
              class="menu-check"
              aria-checked="false"
              data-theme-choice="light"
            >
              <span class="menu-check-mark" aria-hidden="true"></span>
              <span class="menu-check-label">Light</span>
            </button>
            <button
              type="button"
              role="menuitemradio"
              class="menu-check"
              aria-checked="false"
              data-theme-choice="dark"
            >
              <span class="menu-check-mark" aria-hidden="true"></span>
              <span class="menu-check-label">Dark</span>
            </button>
            <button
              type="button"
              role="menuitemradio"
              class="menu-check"
              aria-checked="true"
              data-theme-choice="system"
            >
              <span class="menu-check-mark" aria-hidden="true">✓</span>
              <span class="menu-check-label">System</span>
            </button>
            <hr class="menu-sep" />
            <button
              type="button"
              role="menuitemcheckbox"
              class="menu-check"
              aria-checked="true"
              data-sfx-toggle
            >
              <span class="menu-check-mark" aria-hidden="true">✓</span>
              <span class="menu-check-label">Answer sounds</span>
            </button>
            <hr class="menu-sep" />
            <button
              type="button"
              role="menuitemradio"
              class="menu-check"
              aria-checked="true"
              data-scaffold-difficulty="assisted"
            >
              <span class="menu-check-mark" aria-hidden="true">✓</span>
              <span class="menu-check-label">Assisted</span>
            </button>
            <button
              type="button"
              role="menuitemradio"
              class="menu-check"
              aria-checked="false"
              data-scaffold-difficulty="core"
            >
              <span class="menu-check-mark" aria-hidden="true"></span>
              <span class="menu-check-label">Core</span>
            </button>
            <hr class="menu-sep" />
            <button
              type="button"
              role="menuitem"
              id="btn-session-audit"
              data-open-session-audit
            >
              Session Q&amp;A &amp; Dealer
            </button>
          </div>
        </div>

        <div class="menu territory-menu" data-territory="nouns" hidden>
          <button
            type="button"
            class="territory-menu-btn"
            aria-expanded="false"
            aria-haspopup="true"
          >
            Nouns
          </button>
          <div class="menu-panel" role="menu" hidden>
            <button type="button" role="menuitem" data-show-briefing="nouns">
              Briefing
            </button>
            <button type="button" role="menuitem" data-open-chart="nouns">
              Reference Chart
            </button>
            <button type="button" role="menuitem" data-open-reference="nouns">
              Browse Reference
            </button>
            <hr class="menu-sep" />
            <button type="button" role="menuitem" data-nouns-hub>
              Nouns home
            </button>
            <button type="button" role="menuitem" data-vocab-open data-vocab-mode="learn" data-vocab-territory="nouns">
              Vocabulary
            </button>
            <hr class="menu-sep" />
            <p class="menu-group-label">Gender Shortcuts</p>
            <button
              type="button"
              role="menuitem"
              data-nouns-unit="suffixes"
            >
              Suffixes
            </button>
            <button
              type="button"
              role="menuitem"
              data-nouns-unit="categories"
            >
              Categories
            </button>
            <hr class="menu-sep" />
            <p class="menu-group-label">Coming soon</p>
            <button type="button" role="menuitem" disabled>
              Plurals
            </button>
            <button type="button" role="menuitem" disabled>
              Articles
            </button>
          </div>
        </div>

        <div class="menu territory-menu" data-territory="sounds" hidden>
          <button
            type="button"
            class="territory-menu-btn"
            aria-expanded="false"
            aria-haspopup="true"
          >
            Sounds
          </button>
          <div class="menu-panel" role="menu" hidden>
            <button type="button" role="menuitem" data-show-briefing="sounds">
              Briefing
            </button>
            <button type="button" role="menuitem" data-open-chart="sounds">
              Reference Chart
            </button>
            <button type="button" role="menuitem" data-open-reference="sounds">
              Browse Reference
            </button>
            <hr class="menu-sep" />
            <button
              type="button"
              role="menuitem"
              class="is-on"
              data-sounds-mode="karaoke"
            >
              Syllables
            </button>
            <button
              type="button"
              role="menuitem"
              data-sounds-mode="discriminate"
            >
              Discriminate
            </button>
          </div>
        </div>

        <span class="territory-menu-btn coming-title" id="coming-title" hidden>
          Coming soon
        </span>
      </header>

      <!-- Persistent session chrome: active mode + breadcrumb (Numbers · Tens) -->
      <div class="session-crumb" id="session-crumb" hidden>
        <span class="session-mode" id="session-mode" data-mode=""></span>
        <nav class="session-breadcrumb" id="session-breadcrumb" aria-label="Location"></nav>
        <div class="session-playlist-host" id="session-playlist-host" hidden></div>
      </div>

      <main>
        <!-- HUB — nav carousel (Learn | Play → territories) -->
        <section id="view-hub" class="view is-active nc-hub" aria-label="Hub">
          <div id="nav-carousel-root"></div>
        </section>

        <!-- NUMBERS -->
        <section
          id="view-numbers"
          class="view view-session"
          aria-label="Numbers territory"
          hidden
        >
          <div class="numbers-hub" id="numbers-hub" hidden></div>
          <div class="vocab-panel" id="numbers-vocab" hidden></div>
          <div class="briefing" id="numbers-briefing" hidden></div>
          <div class="sound-chart" id="numbers-chart" hidden></div>
          <div class="stage stage-fill" id="numbers-stage" hidden>
            <p class="action-instruction" id="numbers-instruction" hidden></p>
            <p class="prompt" id="numbers-prompt"></p>
            <p
              class="exercise-feedback"
              id="numbers-feedback"
              hidden
              aria-live="polite"
            ></p>
            <div
              class="slot-row"
              id="numbers-slots"
              aria-label="Answer slots"
            ></div>
            <div class="tray" id="numbers-tray" aria-label="Number pieces"></div>
            <p
              class="attempt-feedback"
              id="numbers-attempt-feedback"
              hidden
              aria-live="polite"
            ></p>
            <div class="answer-reveal" id="numbers-reveal" hidden>
              <p class="verdict" id="numbers-verdict" aria-live="polite"></p>
              <div class="answer-reveal-box">
                <p class="answer-reveal-de" id="numbers-reveal-word" lang="de"></p>
                <p
                  class="answer-reveal-phonetic"
                  id="numbers-reveal-phonetic"
                  aria-live="polite"
                ></p>
              </div>
              <p class="answer-reveal-en" id="numbers-reveal-en" hidden></p>
            </div>
            <div class="actions actions-nav" id="numbers-actions">
              <button
                type="button"
                class="btn btn-icon"
                id="numbers-back"
                data-icon="chevronLeft"
                aria-label="Back"
                title="Back"
              ></button>
              <div class="actions-mid">
                <button
                  type="button"
                  class="btn btn-icon"
                  id="numbers-help"
                  data-icon="lightbulb"
                  aria-label="Help"
                  title="Help"
                ></button>
              </div>
              <button
                type="button"
                class="btn btn-icon"
                id="numbers-skip"
                data-icon="chevronRight"
                aria-label="Forward"
                title="Forward — next in sequence, or skip at the end"
              ></button>
            </div>
          </div>
        </section>

        <!-- NOUNS -->
        <section
          id="view-nouns"
          class="view view-session"
          aria-label="Nouns territory"
          hidden
        >
          <div class="briefing" id="nouns-briefing"></div>
          <div class="numbers-hub" id="nouns-hub" hidden></div>
          <div class="vocab-panel" id="nouns-vocab" hidden></div>
          <div class="sound-chart" id="nouns-chart" hidden></div>
          <div class="stage stage-fill" id="nouns-stage" hidden>
            <p class="legend legend-text" id="nouns-legend" aria-label="Gender key">
              <span class="nom-scope">Nominative singular</span>
              <span class="g-key g-masc">der</span>
              <span class="g-key g-fem">die</span>
              <span class="g-key g-neut">das</span>
            </p>
            <p class="family-progress" id="nouns-family-progress" hidden></p>
            <p class="action-instruction" id="nouns-instruction" hidden></p>
            <p class="prompt" id="nouns-prompt"></p>
            <p
              class="exercise-feedback"
              id="nouns-feedback"
              hidden
              aria-live="polite"
            ></p>
            <p class="help-line" id="nouns-help-line" hidden></p>
            <p class="help-line" id="nouns-translation" hidden></p>
            <div class="slot-row" id="nouns-slots" aria-label="Phrase slots">
              <div
                class="slot"
                data-slot="article"
                data-accept="article"
                tabindex="0"
              >
                Article
              </div>
              <div
                class="slot is-filled noun-unit"
                id="nouns-noun-slot"
                aria-live="polite"
              ></div>
            </div>
            <div class="tray" id="nouns-tray" aria-label="Answer pieces"></div>
            <p
              class="attempt-feedback"
              id="nouns-attempt-feedback"
              hidden
              aria-live="polite"
            ></p>
            <div class="answer-reveal" id="nouns-reveal" hidden>
              <p class="verdict" id="nouns-verdict" aria-live="polite"></p>
              <div class="answer-reveal-box">
                <p class="answer-reveal-de" id="nouns-reveal-word" lang="de"></p>
                <p
                  class="answer-reveal-phonetic"
                  id="nouns-reveal-phonetic"
                  aria-live="polite"
                ></p>
              </div>
              <p class="answer-reveal-en" id="nouns-reveal-en" hidden></p>
            </div>
            <div class="actions actions-nav" id="nouns-actions">
              <button
                type="button"
                class="btn btn-icon"
                id="nouns-back"
                data-icon="chevronLeft"
                aria-label="Back"
                title="Back"
              ></button>
              <div class="actions-mid">
                <button
                  type="button"
                  class="btn btn-icon"
                  id="nouns-help"
                  data-icon="lightbulb"
                  aria-label="Help"
                  title="Help"
                ></button>
              </div>
              <button
                type="button"
                class="btn btn-icon"
                id="nouns-skip"
                data-icon="chevronRight"
                aria-label="Forward"
                title="Forward — next in sequence, or skip at the end"
              ></button>
            </div>
          </div>
        </section>

        <!-- SOUNDS -->
        <section
          id="view-sounds"
          class="view view-session"
          aria-label="Sounds territory"
          hidden
        >
          <div class="briefing" id="sounds-briefing"></div>
          <div class="sound-chart" id="sounds-chart" hidden></div>
          <div class="stage stage-fill" id="sounds-stage" hidden>
            <p class="prompt" id="sounds-prompt"></p>
            <p class="help-line" id="sounds-help"></p>

            <div class="sound-reps" id="sounds-reps" hidden>
              <div class="rep">
                <span class="rep-label">Learner</span>
                <span class="rep-value" id="sounds-learner"></span>
              </div>
              <div class="rep">
                <span class="rep-label">Linguistic</span>
                <span class="rep-value mono" id="sounds-ipa"></span>
              </div>
              <div class="rep">
                <span class="rep-label">Spoken (TTS)</span>
                <span class="rep-value mono" id="sounds-tts"></span>
              </div>
            </div>

            <div class="play-row" id="sounds-play-row" hidden></div>
            <div class="karaoke" id="sounds-karaoke" hidden aria-live="polite"></div>
            <div class="choice-grid" id="sounds-choices" hidden></div>

            <p
              class="attempt-feedback"
              id="sounds-attempt-feedback"
              hidden
              aria-live="polite"
            ></p>
            <div class="answer-reveal" id="sounds-reveal" hidden>
              <p class="verdict" id="sounds-verdict" aria-live="polite"></p>
              <div class="answer-reveal-box">
                <p class="answer-reveal-de" id="sounds-reveal-word" lang="de"></p>
                <p
                  class="answer-reveal-phonetic"
                  id="sounds-reveal-phonetic"
                  aria-live="polite"
                ></p>
              </div>
              <p class="answer-reveal-en" id="sounds-reveal-en" hidden></p>
            </div>

            <div class="actions actions-nav" id="sounds-actions"></div>
          </div>
        </section>

        <!-- COMING SOON -->
        <section
          id="view-coming"
          class="view view-session"
          aria-label="Coming soon"
          hidden
        >
          <div class="stage stage-fill coming-stage">
            <p id="coming-body"></p>
            <p class="help-line">
              On the map so navigation stays honest before each door is built.
            </p>
          </div>
        </section>
      </main>
    </div>

    <div class="sheet" id="app-sheet" hidden>
      <div class="sheet-backdrop" id="sheet-backdrop"></div>
      <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="sheet-head">
          <h3 id="sheet-title">Reference</h3>
          <button type="button" class="chip" id="sheet-close">Close</button>
        </div>
        <div class="sheet-body" id="sheet-body"></div>
      </div>
    </div>

    <script type="module" src="./js/mock.js?v=20261001-listenask1"></script>
  </body>
</html>
