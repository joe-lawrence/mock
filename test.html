<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kitchen Gyro Camera Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #0f172a; color: #f8fafc;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }
        
        #game-container {
            position: relative; width: 100vw; height: 100vh; overflow: hidden;
        }

        #world-wrapper {
            position: absolute;
            left: 50%; top: 50%;
            transform-origin: center center;
            will-change: transform;
        }

        #kitchen-img {
            display: block; pointer-events: none;
            max-width: none !important; max-height: none !important;
        }

        #overlay-svg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; 
        }

        #touch-overlay {
            position: absolute; inset: 0; z-index: 10; cursor: crosshair;
        }

        .slider-thumb::-webkit-slider-thumb {
            appearance: none; width: 16px; height: 16px; background: #818cf8; border-radius: 50%; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- SETTINGS / START SCREEN -->
    <div id="setup-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-slate-900 p-6">
        <h1 class="text-3xl font-bold mb-2 text-indigo-400">Kitchen Scene</h1>
        
        <div id="json-status" class="text-sm font-medium px-4 py-2 rounded bg-slate-800 text-slate-400 border border-slate-700 animate-pulse text-center">
            Attempting to auto-load kitchen.json...
        </div>

        <div id="manual-upload-container" class="mt-3 hidden text-center w-full max-w-sm">
            <input type="file" id="local-file-upload" accept=".json" class="hidden">
            <button id="upload-btn" class="w-full py-2 bg-slate-700 hover:bg-slate-600 border border-slate-500 text-white font-medium rounded shadow transition-colors">
                Select kitchen.json Manually
            </button>
        </div>

        <div class="w-full max-w-sm space-y-6 bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl mt-4">
            <div>
                <div class="flex justify-between mb-2"><label class="text-sm font-medium text-slate-300">Pan Control Mode</label></div>
                <div class="flex gap-2 bg-slate-900 p-1 rounded-lg border border-slate-700">
                    <button id="mode-tilt-btn" class="flex-1 py-2 text-sm font-bold bg-indigo-600 text-white rounded-md shadow transition-colors">Tilt to Pan</button>
                    <button id="mode-swipe-btn" class="flex-1 py-2 text-sm font-medium text-slate-400 hover:text-slate-200 rounded-md transition-colors">Swipe to Pan</button>
                </div>
            </div>
            <div>
                <div class="flex justify-between mb-1"><label class="text-sm font-medium text-slate-300">Tilt Deadzone</label><span id="deadzone-val" class="text-sm text-indigo-400 font-bold">2.0°</span></div>
                <input type="range" id="deadzone-slider" min="0" max="10" step="0.5" value="2" class="w-full h-2 bg-slate-700 rounded-lg appearance-none slider-thumb">
            </div>
            <div id="pan-sensitivity-container">
                <div class="flex justify-between mb-1"><label class="text-sm font-medium text-slate-300">Tilt Pan Sensitivity</label><span id="pan-val" class="text-sm text-indigo-400 font-bold">1.0x</span></div>
                <input type="range" id="pan-slider" min="0.1" max="2.5" step="0.1" value="1.0" class="w-full h-2 bg-slate-700 rounded-lg appearance-none slider-thumb">
            </div>
            <div>
                <div class="flex justify-between mb-1"><label class="text-sm font-medium text-slate-300">Zoom Sensitivity</label><span id="zoom-val" class="text-sm text-indigo-400 font-bold">1.0x</span></div>
                <input type="range" id="zoom-slider" min="0.1" max="2.5" step="0.1" value="1.0" class="w-full h-2 bg-slate-700 rounded-lg appearance-none slider-thumb">
            </div>
            
            <button id="start-btn" disabled class="w-full py-3 mt-4 bg-slate-600 text-white font-bold rounded-lg shadow-lg opacity-50 cursor-not-allowed transition-all">
                Waiting for map data...
            </button>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="hidden absolute inset-0">
        <div id="game-container">
            
            <div id="world-wrapper">
                <img id="kitchen-img" src="new-kitchen.jpeg" alt="Kitchen Scene">
                
                <svg id="overlay-svg" preserveAspectRatio="none">
                    <defs>
                        <filter id="shape-glow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur in="SourceGraphic" id="dynamic-blur-outer" stdDeviation="40" result="outer-blur" />
                            <feGaussianBlur in="SourceGraphic" id="dynamic-blur-inner" stdDeviation="10" result="inner-blur" />
                            <feMerge result="merged-blurs">
                                <feMergeNode in="outer-blur" />
                                <feMergeNode in="inner-blur" />
                            </feMerge>
                            <feComponentTransfer in="merged-blurs" result="boosted-glow">
                                <feFuncA type="linear" slope="3" />
                            </feComponentTransfer>
                        </filter>
                    </defs>
                </svg>
            </div>

            <div id="touch-overlay"></div>
        </div>

        <!-- TARGET TYPE SELECTOR (Bottom Pill) -->
        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 flex p-1.5 bg-slate-800/90 backdrop-blur border border-slate-600 rounded-full shadow-2xl pointer-events-auto">
            <button class="target-type-btn px-5 py-2 text-sm font-bold rounded-full bg-indigo-500 text-white shadow transition-all" data-type="noun">Nouns</button>
            <button class="target-type-btn px-5 py-2 text-sm font-medium rounded-full text-slate-300 hover:text-white transition-all" data-type="action">Actions</button>
            <button class="target-type-btn px-5 py-2 text-sm font-medium rounded-full text-slate-300 hover:text-white transition-all" data-type="person">People</button>
            <button class="target-type-btn px-5 py-2 text-sm font-medium rounded-full text-slate-300 hover:text-white transition-all" data-type="relation">Relations</button>
        </div>

        <!-- LIVE VISUAL SETTINGS PANEL -->
        <div id="visual-settings-panel" class="hidden absolute top-20 left-4 w-64 bg-slate-900/95 backdrop-blur border border-slate-700 rounded-xl p-4 shadow-2xl z-30 pointer-events-auto">
            <h3 class="text-white font-bold mb-4 text-sm flex justify-between items-center border-b border-slate-700 pb-2">
                Visual Polish 
                <button id="close-visuals-btn" class="text-slate-400 hover:text-white px-2 rounded hover:bg-slate-700">✕</button>
            </h3>
            
            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <label class="text-xs font-medium text-slate-300">Glow Color</label>
                    <input type="color" id="vis-color" value="#facc15" class="bg-transparent border-none w-6 h-6 p-0 cursor-pointer">
                </div>
                <div>
                    <div class="flex justify-between mb-1"><label class="text-xs text-slate-300">Resting Opacity</label><span id="val-base-op" class="text-xs text-indigo-400">0.0</span></div>
                    <input type="range" id="vis-base-op" min="0" max="1" step="0.05" value="0.0" class="w-full h-1 bg-slate-700 rounded appearance-none slider-thumb">
                </div>
                <div>
                    <div class="flex justify-between mb-1"><label class="text-xs text-slate-300">Pulse Opacity</label><span id="val-high-op" class="text-xs text-indigo-400">0.3</span></div>
                    <input type="range" id="vis-high-op" min="0" max="1" step="0.05" value="0.3" class="w-full h-1 bg-slate-700 rounded appearance-none slider-thumb">
                </div>
                <div>
                    <div class="flex justify-between mb-1"><label class="text-xs text-slate-300">Edge Softness (Outer)</label><span id="val-out-blur" class="text-xs text-indigo-400">5.0%</span></div>
                    <input type="range" id="vis-out-blur" min="0" max="10" step="0.5" value="5.0" class="w-full h-1 bg-slate-700 rounded appearance-none slider-thumb">
                </div>
                <div>
                    <div class="flex justify-between mb-1"><label class="text-xs text-slate-300">Core Softness (Inner)</label><span id="val-in-blur" class="text-xs text-indigo-400">1.0%</span></div>
                    <input type="range" id="vis-in-blur" min="0" max="5" step="0.1" value="1.0" class="w-full h-1 bg-slate-700 rounded appearance-none slider-thumb">
                </div>
            </div>
        </div>

        <!-- HUD -->
        <div class="absolute top-0 left-0 w-full p-4 z-20 flex justify-between items-start pointer-events-none">
            <div class="flex flex-col gap-3 pointer-events-auto">
                <div class="flex gap-2">
                    <button id="back-btn" class="bg-slate-800/80 backdrop-blur border border-slate-600 text-sm px-4 py-2 rounded-lg hover:bg-slate-700 shadow-lg">
                        ← Settings
                    </button>
                    <button id="open-visuals-btn" class="bg-indigo-600/90 backdrop-blur border border-indigo-500 text-sm px-4 py-2 rounded-lg hover:bg-indigo-500 shadow-lg transition-colors">
                        🎨 Visuals
                    </button>
                </div>
                <button id="recalibrate-btn" class="bg-slate-800/80 backdrop-blur border border-slate-600 text-sm px-4 py-2 rounded-lg hover:bg-slate-700 shadow-lg w-max">
                    ⌖ Center Camera
                </button>
            </div>

            <div class="flex flex-col items-end">
                <div id="mode-indicator" class="bg-emerald-500/20 border border-emerald-500 text-emerald-400 font-bold px-4 py-2 rounded-full backdrop-blur shadow-lg">
                    👁️ PAN MODE
                </div>
                <p id="instruction-text" class="text-xs text-slate-300 mt-2 bg-slate-900/60 px-2 py-1 rounded backdrop-blur">
                    Press & hold to Zoom
                </p>
                <div id="selection-hud" class="mt-4 opacity-0 transition-all duration-300 font-bold px-6 py-3 rounded-xl shadow-lg backdrop-blur scale-105">
                    <span id="selection-word"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. DATA MODEL ---
        let sceneData = null;
        let activeTargetType = 'noun';

        // Visual Styling State (Updated Defaults)
        let visualStyle = {
            color: '#facc15', 
            baseOpacity: 0.0,  
            highOpacity: 0.3, 
            outerBlur: 5.0,   
            innerBlur: 1.0    
        };

        const fallbackData = {
            "scene_id": "scene.kueche",
            "targets": [
                { "target_id": "scene.kueche.target.kuehlschrank", "type": "noun", "label": "der Kühlschrank", "polygons": [ [[0.02, 0.25], [0.18, 0.25], [0.18, 0.95], [0.02, 0.95]] ] },
                { "target_id": "scene.kueche.target.spuele", "type": "noun", "label": "die Spüle", "polygons": [ [[0.28, 0.53], [0.46, 0.53], [0.46, 0.61], [0.28, 0.61]] ] }
            ]
        };

        async function loadSceneMap() {
            const statusEl = document.getElementById('json-status');
            const manualUploadContainer = document.getElementById('manual-upload-container');
            
            try {
                const response = await fetch(`kitchen.json?v=${Date.now()}`);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                sceneData = await response.json();
                enableStartButton('kitchen.json loaded automatically');
            } catch (error) {
                sceneData = fallbackData; 
                statusEl.innerHTML = '❌ Could not auto-load kitchen.json.<br><span class="text-xs text-amber-400">Using embedded fallback data.</span>';
                statusEl.className = 'text-sm font-medium px-4 py-2 rounded bg-slate-800 text-slate-300 border border-slate-600 mt-4 text-center';
                statusEl.classList.remove('animate-pulse');
                manualUploadContainer.classList.remove('hidden');
                enableStartButton('Ready (Using Fallback Data)');
            }
        }

        document.getElementById('upload-btn').addEventListener('click', () => { document.getElementById('local-file-upload').click(); });
        document.getElementById('local-file-upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    sceneData = JSON.parse(event.target.result);
                    document.getElementById('manual-upload-container').classList.add('hidden');
                    enableStartButton(`${file.name} loaded manually`);
                } catch(err) { alert("Invalid JSON file formatting."); }
            };
            reader.readAsText(file);
        });

        function enableStartButton(successMessage) {
            const statusEl = document.getElementById('json-status');
            const startBtn = document.getElementById('start-btn');
            statusEl.innerHTML = `✅ ${successMessage}`;
            statusEl.className = 'text-sm font-medium px-4 py-2 rounded bg-emerald-900/40 text-emerald-400 border border-emerald-800 mb-3';
            statusEl.classList.remove('animate-pulse');
            startBtn.disabled = false;
            startBtn.innerHTML = 'Enter Scene';
            startBtn.className = 'w-full py-3 mt-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg shadow-lg cursor-pointer transition-all';
        }

        loadSceneMap();

        // --- 2. LIVE VISUAL CONTROLS LOGIC ---
        const visualPanel = document.getElementById('visual-settings-panel');
        document.getElementById('open-visuals-btn').addEventListener('click', () => {
            visualPanel.classList.toggle('hidden');
            const btn = document.getElementById('open-visuals-btn');
            if (visualPanel.classList.contains('hidden')) {
                btn.classList.replace('bg-indigo-500', 'bg-indigo-600/90');
            } else {
                btn.classList.replace('bg-indigo-600/90', 'bg-indigo-500');
            }
        });
        document.getElementById('close-visuals-btn').addEventListener('click', () => {
            visualPanel.classList.add('hidden');
            document.getElementById('open-visuals-btn').classList.replace('bg-indigo-500', 'bg-indigo-600/90');
        });

        function updateLiveBlur() {
            document.getElementById('dynamic-blur-outer').setAttribute('stdDeviation', baseW * (visualStyle.outerBlur / 100)); 
            document.getElementById('dynamic-blur-inner').setAttribute('stdDeviation', baseW * (visualStyle.innerBlur / 100)); 
        }

        function refreshActiveOpacities() {
            if (!sceneData || !sceneData.targets) return;
            sceneData.targets.forEach(target => {
                const group = document.getElementById(`group-${target.target_id}`);
                if (!group) return;
                
                if (target.type === activeTargetType) {
                    group.querySelectorAll('polygon').forEach(p => p.style.opacity = visualStyle.baseOpacity);
                } else {
                    group.querySelectorAll('polygon').forEach(p => p.style.opacity = '0');
                }
            });
        }

        document.getElementById('vis-color').addEventListener('input', (e) => {
            visualStyle.color = e.target.value;
            svg.querySelectorAll('polygon').forEach(p => p.setAttribute('fill', visualStyle.color));
        });
        document.getElementById('vis-base-op').addEventListener('input', (e) => {
            visualStyle.baseOpacity = parseFloat(e.target.value);
            document.getElementById('val-base-op').innerText = visualStyle.baseOpacity.toFixed(2);
            refreshActiveOpacities();
        });
        document.getElementById('vis-high-op').addEventListener('input', (e) => {
            visualStyle.highOpacity = parseFloat(e.target.value);
            document.getElementById('val-high-op').innerText = visualStyle.highOpacity.toFixed(2);
        });
        document.getElementById('vis-out-blur').addEventListener('input', (e) => {
            visualStyle.outerBlur = parseFloat(e.target.value);
            document.getElementById('val-out-blur').innerText = visualStyle.outerBlur.toFixed(1) + '%';
            updateLiveBlur();
        });
        document.getElementById('vis-in-blur').addEventListener('input', (e) => {
            visualStyle.innerBlur = parseFloat(e.target.value);
            document.getElementById('val-in-blur').innerText = visualStyle.innerBlur.toFixed(1) + '%';
            updateLiveBlur();
        });

        // --- 3. UI: TYPE SELECTOR ---
        document.querySelectorAll('.target-type-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.target-type-btn').forEach(b => {
                    b.className = 'target-type-btn px-5 py-2 text-sm font-medium rounded-full text-slate-300 hover:text-white transition-all';
                });
                e.target.className = 'target-type-btn px-5 py-2 text-sm font-bold rounded-full bg-indigo-500 text-white shadow transition-all';
                
                activeTargetType = e.target.dataset.type;
                
                clearTimeout(clearSelectionTimeout);
                const selectionHud = document.getElementById('selection-hud');
                selectionHud.classList.remove('opacity-100', 'scale-100');
                selectionHud.classList.add('opacity-0', 'scale-105');
                
                refreshActiveOpacities();
            });
        });

        // --- 4. GAME STATE ---
        let isRunning = false; let isHolding = false; let panMode = 'tilt'; let hasInitializedScale = false;
        let baseBeta = null; let baseGamma = null; let curBeta = null; let curGamma = null;
        let x = 0; let y = 0; let scale = 1.0; let vx = 0; let vy = 0; let vs = 0;
        const BASE_PAN_SPEED = 0.6; const BASE_ZOOM_SPEED = 0.005; const FRICTION = 0.82; 
        let deadzone = 2.0; let panSensitivity = 1.0; let zoomSensitivity = 1.0;
        let baseW = 0; let baseH = 0; let scaleCover = 1.0; let scaleContain = 1.0;
        let holdX = window.innerWidth / 2; let holdY = window.innerHeight / 2;
        let activeGesture = null; let touchStartX = 0; let touchStartY = 0; let touchStartTime = 0;
        let lastTouchX = null; let lastTouchY = null;
        let clearSelectionTimeout = null;
        
        // Strict Mutual Exclusivity Tracker
        let hasZoomedThisTouch = false;

        // --- 5. DOM ELEMENTS ---
        const setupScreen = document.getElementById('setup-screen');
        const gameScreen = document.getElementById('game-screen');
        const overlay = document.getElementById('touch-overlay');
        const img = document.getElementById('kitchen-img');
        const wrapper = document.getElementById('world-wrapper');
        const svg = document.getElementById('overlay-svg');
        const modeIndicator = document.getElementById('mode-indicator');
        const instructionText = document.getElementById('instruction-text');
        const selectionHud = document.getElementById('selection-hud');
        const selectionWord = document.getElementById('selection-word');

        document.getElementById('mode-tilt-btn').addEventListener('click', (e) => {
            panMode = 'tilt';
            e.target.className = 'flex-1 py-2 text-sm font-bold bg-indigo-600 text-white rounded-md shadow transition-colors';
            document.getElementById('mode-swipe-btn').className = 'flex-1 py-2 text-sm font-medium text-slate-400 hover:text-slate-200 rounded-md transition-colors';
            document.getElementById('pan-sensitivity-container').style.opacity = '1';
        });
        document.getElementById('mode-swipe-btn').addEventListener('click', (e) => {
            panMode = 'swipe';
            e.target.className = 'flex-1 py-2 text-sm font-bold bg-indigo-600 text-white rounded-md shadow transition-colors';
            document.getElementById('mode-tilt-btn').className = 'flex-1 py-2 text-sm font-medium text-slate-400 hover:text-slate-200 rounded-md transition-colors';
            document.getElementById('pan-sensitivity-container').style.opacity = '0.4';
        });
        document.getElementById('deadzone-slider').addEventListener('input', (e) => { deadzone = parseFloat(e.target.value); document.getElementById('deadzone-val').innerText = `${deadzone.toFixed(1)}°`; });
        document.getElementById('pan-slider').addEventListener('input', (e) => { panSensitivity = parseFloat(e.target.value); document.getElementById('pan-val').innerText = `${panSensitivity.toFixed(1)}x`; });
        document.getElementById('zoom-slider').addEventListener('input', (e) => { zoomSensitivity = parseFloat(e.target.value); document.getElementById('zoom-val').innerText = `${zoomSensitivity.toFixed(1)}x`; });
        
        // --- 6. INITIAL DOM RENDER ---
        function renderPolygons() {
            if (!sceneData || !sceneData.targets) return;
            svg.setAttribute('viewBox', `0 0 ${baseW} ${baseH}`);
            updateLiveBlur(); 

            svg.querySelectorAll('.hotspot-group').forEach(el => el.remove());

            sceneData.targets.forEach(target => {
                const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
                group.classList.add('hotspot-group');
                group.setAttribute('id', `group-${target.target_id}`);

                if (target.polygons) {
                    target.polygons.forEach(poly => {
                        const pointsStr = poly.map(pt => `${pt[0]*baseW},${pt[1]*baseH}`).join(" ");
                        const polygon = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
                        polygon.setAttribute('points', pointsStr);
                        polygon.setAttribute('fill', visualStyle.color); 
                        polygon.setAttribute('filter', 'url(#shape-glow)');
                        polygon.style.opacity = (target.type === activeTargetType) ? visualStyle.baseOpacity : '0';
                        polygon.style.transition = 'opacity 0.6s ease-out';
                        group.appendChild(polygon);
                    });
                }
                svg.appendChild(group);
            });
        }

        function calculateBaseSize() {
            if (!img.complete || img.naturalWidth === 0) { setTimeout(calculateBaseSize, 50); return; }
            baseW = img.naturalWidth; baseH = img.naturalHeight;
            wrapper.style.width = `${baseW}px`; wrapper.style.height = `${baseH}px`;
            const ww = window.innerWidth; const wh = window.innerHeight;
            scaleContain = Math.min(ww / baseW, wh / baseH); 
            scaleCover = Math.max(ww / baseW, wh / baseH);   
            if (!hasInitializedScale) { scale = scaleCover; hasInitializedScale = true; }
            renderPolygons(); updateTransform();
        }
        img.onload = calculateBaseSize; window.addEventListener('resize', calculateBaseSize);

        // --- 7. RAY-CASTING SELECTION MATH ---
        function pointInPolygon(point, vs) {
            let x = point[0], y = point[1]; let inside = false;
            for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
                let xi = vs[i][0], yi = vs[i][1]; let xj = vs[j][0], yj = vs[j][1];
                let intersect = ((yi > y) != (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        function handleTapSelection(clientX, clientY) {
            if (!sceneData || !sceneData.targets) return;
            
            const rect = wrapper.getBoundingClientRect();
            const tapX = clientX - rect.left;
            const tapY = clientY - rect.top;
            const normX = tapX / rect.width;
            const normY = tapY / rect.height;

            let foundTarget = null;
            sceneData.targets.filter(t => t.type === activeTargetType).forEach(target => {
                if (target.polygons) {
                    target.polygons.forEach(poly => {
                        if (pointInPolygon([normX, normY], poly)) foundTarget = target;
                    });
                }
            });

            clearTimeout(clearSelectionTimeout);
            refreshActiveOpacities(); 
            
            if (foundTarget) {
                const targetGroup = document.getElementById(`group-${foundTarget.target_id}`);
                
                if (targetGroup) {
                    targetGroup.querySelectorAll('polygon').forEach(p => {
                        p.style.transition = 'none'; 
                        
                        const anim = p.animate([
                            { opacity: visualStyle.baseOpacity, offset: 0 },
                            { opacity: visualStyle.highOpacity, offset: 0.5 },
                            { opacity: visualStyle.baseOpacity, offset: 1.0 }
                        ], {
                            duration: 800, 
                            iterations: 3,
                            easing: 'ease-in-out'
                        });
                        
                        anim.onfinish = () => {
                            p.style.opacity = visualStyle.baseOpacity;
                            p.style.transition = 'opacity 0.6s ease-out';
                        };
                    });
                }
                
                selectionWord.innerText = foundTarget.label;
                selectionHud.className = "mt-4 opacity-100 transition-all duration-300 font-bold px-6 py-3 rounded-xl shadow-lg backdrop-blur scale-100 bg-amber-500/90 text-slate-900 shadow-amber-900/50";
                
                clearSelectionTimeout = setTimeout(() => {
                    selectionHud.classList.remove('opacity-100', 'scale-100');
                    selectionHud.classList.add('opacity-0', 'scale-105');
                }, 2800); 

            } else {
                selectionWord.innerText = "Nothing selected";
                selectionHud.className = "mt-4 opacity-100 transition-all duration-300 font-bold px-6 py-3 rounded-xl shadow-lg backdrop-blur scale-100 bg-slate-800/90 text-slate-200 shadow-slate-900/50";
                clearSelectionTimeout = setTimeout(() => {
                    selectionHud.classList.remove('opacity-100', 'scale-100');
                    selectionHud.classList.add('opacity-0', 'scale-105');
                }, 1000);
            }
        }

        // --- 8. CRASH-PROOF EVENT HANDLING ---
        function isUIElement(e) {
            if (!e || !e.target || typeof e.target.closest !== 'function') return false;
            return e.target.closest('#visual-settings-panel') || 
                   e.target.closest('.target-type-btn') || 
                   e.target.closest('button');
        }

        function handleTouchStart(e, clientX, clientY) {
            isHolding = true; activeGesture = 'none'; hasZoomedThisTouch = false;
            if (curBeta !== null) { baseBeta = curBeta; baseGamma = curGamma; }
            vx = 0; vy = 0; vs = 0; 
            holdX = clientX; holdY = clientY;
            touchStartX = clientX; touchStartY = clientY;
            lastTouchX = clientX; lastTouchY = clientY;
            touchStartTime = Date.now();
            
            if (panMode === 'swipe') {
                modeIndicator.innerHTML = '👆 TOUCHED'; 
                instructionText.innerText = 'Drag to Pan / Tilt to Zoom';
            } else {
                modeIndicator.innerHTML = '🔍 ZOOM MODE';
                modeIndicator.className = 'bg-amber-500/20 border border-amber-500 text-amber-400 font-bold px-4 py-2 rounded-full backdrop-blur shadow-lg shadow-amber-900/20';
            }
        }

        function handleTouchMove(e, clientX, clientY) {
            if (isHolding && panMode === 'swipe') {
                if (activeGesture === 'none') {
                    const dist = Math.hypot(clientX - touchStartX, clientY - touchStartY);
                    if (dist > 10) { 
                        activeGesture = 'pan'; 
                        modeIndicator.innerHTML = '👆 SWIPING'; instructionText.innerText = 'Zoom Locked';
                        vs = 0; 
                    }
                }
                if (activeGesture === 'pan') {
                    x += (clientX - lastTouchX); y += (clientY - lastTouchY);
                    vx = 0; vy = 0; vs = 0; 
                }
                lastTouchX = clientX; lastTouchY = clientY;
            }
        }

        function handleTouchEnd(e, clientX, clientY) {
            isHolding = false;
            const dist = Math.hypot(clientX - touchStartX, clientY - touchStartY);
            const time = Date.now() - touchStartTime;
            
            // STRICT MUTUAL EXCLUSIVITY: Tap only works if no zoom was triggered during the hold
            if (dist < 20 && time < 500 && !isUIElement(e) && !hasZoomedThisTouch) { 
                try { handleTapSelection(clientX, clientY); } catch(err) { console.error("Selection crashed:", err); }
            }
            
            activeGesture = null; lastTouchX = null; lastTouchY = null;
            modeIndicator.innerHTML = '👁️ PAN MODE';
            modeIndicator.className = 'bg-emerald-500/20 border border-emerald-500 text-emerald-400 font-bold px-4 py-2 rounded-full backdrop-blur shadow-lg shadow-emerald-900/20';
            instructionText.innerText = panMode === 'swipe' ? 'Touch & Drag to Pan' : 'Press & hold to Zoom';
            
            if (curBeta !== null) { baseBeta = curBeta; baseGamma = curGamma; }
            vx = 0; vy = 0; vs = 0;
        }

        overlay.addEventListener('touchstart', (e) => { 
            if(!isUIElement(e)) e.preventDefault(); 
            handleTouchStart(e, e.touches[0].clientX, e.touches[0].clientY); 
        }, { passive: false });
        
        overlay.addEventListener('touchmove', (e) => { 
            if(!isUIElement(e)) e.preventDefault(); 
            handleTouchMove(e, e.touches[0].clientX, e.touches[0].clientY); 
        }, { passive: false });
        
        overlay.addEventListener('touchend', (e) => { 
            if(!isUIElement(e)) e.preventDefault(); 
            handleTouchEnd(e, e.changedTouches[0].clientX, e.changedTouches[0].clientY); 
        });
        
        overlay.addEventListener('mousedown', (e) => { if(!isUIElement(e)) handleTouchStart(e, e.clientX, e.clientY); });
        overlay.addEventListener('mousemove', (e) => { handleTouchMove(e, e.clientX, e.clientY); });
        overlay.addEventListener('mouseup', (e) => { handleTouchEnd(e, e.clientX, e.clientY); });
        overlay.addEventListener('mouseleave', () => { if(isHolding) handleTouchEnd(null, lastTouchX, lastTouchY); });
        overlay.addEventListener('wheel', (e) => { if(!isUIElement(e)) { e.preventDefault(); holdX = e.clientX; holdY = e.clientY; vs += e.deltaY * -0.001 * zoomSensitivity; } }, { passive: false });

        // --- 9. PHYSICS & GYRO LOOP ---
        function handleOrientation(event) { curBeta = event.beta; curGamma = event.gamma; if (baseBeta === null) { baseBeta = curBeta; baseGamma = curGamma; } }
        function updateTransform() { wrapper.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px) scale(${scale})`; }

        function gameLoop() {
            if (!isRunning) return;
            const ww = window.innerWidth; const wh = window.innerHeight;

            if (baseBeta !== null && curBeta !== null) {
                let dBeta = curBeta - baseBeta; let dGamma = curGamma - baseGamma;
                if (dBeta > 180) dBeta -= 360; if (dBeta < -180) dBeta += 360;
                if (dGamma > 90) dGamma -= 180; if (dGamma < -90) dGamma += 180;

                let activeBeta = 0; if (Math.abs(dBeta) > deadzone) activeBeta = dBeta > 0 ? dBeta - deadzone : dBeta + deadzone;
                let activeGamma = 0; if (Math.abs(dGamma) > deadzone) activeGamma = dGamma > 0 ? dGamma - deadzone : dGamma + deadzone;

                if (isHolding) {
                    if (panMode === 'swipe') {
                        if (activeGesture === 'none' && Math.abs(activeBeta) > 0) { activeGesture = 'zoom'; }
                        if (activeGesture === 'zoom') { vs += -activeBeta * (BASE_ZOOM_SPEED * zoomSensitivity); vx = 0; vy = 0; hasZoomedThisTouch = true; } 
                        else if (activeGesture === 'pan') { vs = 0; }
                    } else {
                        if (Math.abs(activeBeta) > 0) hasZoomedThisTouch = true;
                        vs += -activeBeta * (BASE_ZOOM_SPEED * zoomSensitivity);
                    }
                } else if (panMode === 'tilt') {
                    vx += (-activeGamma * (BASE_PAN_SPEED * panSensitivity)) / scale;
                    vy += (-activeBeta * (BASE_PAN_SPEED * panSensitivity)) / scale;
                }
            }

            vx *= FRICTION; vy *= FRICTION; vs *= FRICTION;

            let oldScale = scale; scale += vs;
            const dynamicMinScale = Math.min(ww / baseW, wh / baseH);
            const dynamicMaxScale = Math.max(scaleCover * 4.0, 4.0); 
            
            // CLEAN ZOOM-OUT GLITCH FIX: Stop velocity perfectly at the boundaries before math is applied
            if (scale < dynamicMinScale) {
                scale = dynamicMinScale;
                vs = 0; 
            } else if (scale > dynamicMaxScale) {
                scale = dynamicMaxScale;
                vs = 0; 
            }
            
            const scaleRatio = scale / oldScale;

            if (scaleRatio !== 1) {
                const offsetX = holdX - (ww / 2); const offsetY = holdY - (wh / 2);
                x = x * scaleRatio + offsetX * (1 - scaleRatio);
                y = y * scaleRatio + offsetY * (1 - scaleRatio);
            }

            x += vx; y += vy;

            const maxPanX = Math.max(0, (baseW * scale - ww) / 2);
            const maxPanY = Math.max(0, (baseH * scale - wh) / 2);

            x = Math.max(-maxPanX, Math.min(maxPanX, x));
            y = Math.max(-maxPanY, Math.min(maxPanY, y));

            updateTransform(); requestAnimationFrame(gameLoop);
        }

        async function initGyro() {
            setupScreen.classList.add('hidden'); gameScreen.classList.remove('hidden');
            try {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const p = await DeviceOrientationEvent.requestPermission();
                    if (p !== 'granted') { panMode = 'swipe'; }
                }
            } catch (e) { panMode = 'swipe'; }
            
            baseBeta = null; baseGamma = null;
            window.addEventListener('deviceorientation', handleOrientation);
            instructionText.innerText = panMode === 'swipe' ? 'Touch & Drag to Pan' : 'Press & hold to Zoom';
            calculateBaseSize(); isRunning = true; requestAnimationFrame(gameLoop);
        }

        function stopGyro() {
            isRunning = false; window.removeEventListener('deviceorientation', handleOrientation);
            gameScreen.classList.add('hidden'); setupScreen.classList.remove('hidden');
        }

        function recalibrate() {
            baseBeta = curBeta; baseGamma = curGamma; vx = 0; vy = 0; vs = 0;
            document.getElementById('recalibrate-btn').classList.add('bg-indigo-400');
            setTimeout(() => document.getElementById('recalibrate-btn').classList.remove('bg-indigo-400'), 200);
        }

        document.getElementById('start-btn').addEventListener('click', initGyro);
        document.getElementById('back-btn').addEventListener('click', stopGyro);
        document.getElementById('recalibrate-btn').addEventListener('click', recalibrate);
    </script>
</body>
</html>
