<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kitchen Gyro Camera Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #kitchen-img {
            position: absolute;
            transform-origin: center center;
            will-change: transform;
            pointer-events: none;
            max-width: none !important;
            max-height: none !important;
        }

        #touch-overlay {
            position: absolute;
            inset: 0;
            z-index: 10;
            cursor: crosshair;
        }

        .slider-thumb::-webkit-slider-thumb {
            appearance: none;
            width: 20px;
            height: 20px;
            background: #6366f1;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- SETTINGS / START SCREEN -->
    <div id="setup-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-slate-900 p-6">
        <h1 class="text-3xl font-bold mb-2 text-indigo-400">Gyro Camera</h1>
        <p class="text-slate-400 mb-8 text-center max-w-md">Find your comfortable resting position, then hit start. The camera will use that angle as your "zero" point.</p>
        
        <div class="w-full max-w-sm space-y-6 bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
            
            <!-- Mode Toggle -->
            <div>
                <div class="flex justify-between mb-2">
                    <label class="text-sm font-medium text-slate-300">Pan Control Mode</label>
                </div>
                <div class="flex gap-2 bg-slate-900 p-1 rounded-lg border border-slate-700">
                    <button id="mode-tilt-btn" class="flex-1 py-2 text-sm font-bold bg-indigo-600 text-white rounded-md shadow transition-colors">Tilt to Pan</button>
                    <button id="mode-swipe-btn" class="flex-1 py-2 text-sm font-medium text-slate-400 hover:text-slate-200 rounded-md transition-colors">Swipe to Pan</button>
                </div>
            </div>

            <!-- Deadzone Slider -->
            <div>
                <div class="flex justify-between mb-1">
                    <label class="text-sm font-medium text-slate-300">Tilt Deadzone</label>
                    <span id="deadzone-val" class="text-sm text-indigo-400 font-bold">2.0°</span>
                </div>
                <input type="range" id="deadzone-slider" min="0" max="10" step="0.5" value="2" class="w-full h-2 bg-slate-700 rounded-lg appearance-none slider-thumb">
            </div>

            <!-- Pan Sensitivity Slider -->
            <div id="pan-sensitivity-container">
                <div class="flex justify-between mb-1">
                    <label class="text-sm font-medium text-slate-300">Tilt Pan Sensitivity</label>
                    <span id="pan-val" class="text-sm text-indigo-400 font-bold">1.0x</span>
                </div>
                <input type="range" id="pan-slider" min="0.1" max="2.5" step="0.1" value="1.0" class="w-full h-2 bg-slate-700 rounded-lg appearance-none slider-thumb">
            </div>

            <!-- Zoom Sensitivity Slider -->
            <div>
                <div class="flex justify-between mb-1">
                    <label class="text-sm font-medium text-slate-300">Zoom Sensitivity</label>
                    <span id="zoom-val" class="text-sm text-indigo-400 font-bold">1.0x</span>
                </div>
                <input type="range" id="zoom-slider" min="0.1" max="2.5" step="0.1" value="1.0" class="w-full h-2 bg-slate-700 rounded-lg appearance-none slider-thumb">
            </div>

            <button id="start-btn" class="w-full py-3 mt-4 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-bold rounded-lg transition-colors shadow-lg">
                Enable Gyro & Start
            </button>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="hidden absolute inset-0">
        <div id="game-container">
            <img id="kitchen-img" src="new-kitchen.jpeg" alt="Kitchen Scene">
            <div id="touch-overlay"></div>
        </div>

        <!-- HUD -->
        <div class="absolute top-0 left-0 w-full p-4 z-20 flex justify-between items-start pointer-events-none">
            <div class="flex flex-col gap-3 pointer-events-auto">
                <button id="back-btn" class="bg-slate-800/80 backdrop-blur border border-slate-600 text-sm px-4 py-2 rounded-lg hover:bg-slate-700 transition shadow-lg">
                    ← Settings
                </button>
                <button id="recalibrate-btn" class="bg-indigo-600/90 backdrop-blur border border-indigo-500 text-sm px-4 py-2 rounded-lg hover:bg-indigo-500 transition shadow-lg shadow-indigo-900/50">
                    ⌖ Recalibrate
                </button>
            </div>

            <div class="flex flex-col items-end">
                <div id="mode-indicator" class="bg-emerald-500/20 border border-emerald-500 text-emerald-400 font-bold px-4 py-2 rounded-full backdrop-blur transition-colors duration-200 shadow-lg">
                    👁️ PAN MODE
                </div>
                <p id="instruction-text" class="text-xs text-slate-300 mt-2 bg-slate-900/60 px-2 py-1 rounded backdrop-blur">
                    Press & hold to Zoom
                </p>
            </div>
        </div>
    </div>

    <script>
        let isRunning = false;
        let isHolding = false;
        let panMode = 'tilt'; // 'tilt' or 'swipe'
        
        let baseBeta = null;
        let baseGamma = null;
        let curBeta = null;
        let curGamma = null;

        // Physics State
        let x = 0;
        let y = 0;
        let scale = 1.0; 
        let vx = 0;
        let vy = 0;
        let vs = 0;

        // Base Tuning Config
        const BASE_PAN_SPEED = 0.6;
        const BASE_ZOOM_SPEED = 0.005;
        const FRICTION = 0.82; 
        const MAX_SCALE = 4.0; 

        // User Settings 
        let deadzone = 2.0; 
        let panSensitivity = 1.0;
        let zoomSensitivity = 1.0;

        // Touch & Gesture Lock Data
        let baseW = 0;
        let baseH = 0;
        let holdX = window.innerWidth / 2;
        let holdY = window.innerHeight / 2;
        
        let activeGesture = null; // 'none', 'pan', or 'zoom'
        let touchStartX = 0;
        let touchStartY = 0;
        let lastTouchX = null;
        let lastTouchY = null;

        // DOM Elements
        const setupScreen = document.getElementById('setup-screen');
        const gameScreen = document.getElementById('game-screen');
        const overlay = document.getElementById('touch-overlay');
        const img = document.getElementById('kitchen-img');
        const modeIndicator = document.getElementById('mode-indicator');
        const instructionText = document.getElementById('instruction-text');
        
        const modeTiltBtn = document.getElementById('mode-tilt-btn');
        const modeSwipeBtn = document.getElementById('mode-swipe-btn');
        const panSensitivityContainer = document.getElementById('pan-sensitivity-container');

        // Mode Toggles
        modeTiltBtn.addEventListener('click', () => {
            panMode = 'tilt';
            modeTiltBtn.className = 'flex-1 py-2 text-sm font-bold bg-indigo-600 text-white rounded-md shadow transition-colors';
            modeSwipeBtn.className = 'flex-1 py-2 text-sm font-medium text-slate-400 hover:text-slate-200 rounded-md transition-colors';
            panSensitivityContainer.style.opacity = '1';
            panSensitivityContainer.style.pointerEvents = 'auto';
        });

        modeSwipeBtn.addEventListener('click', () => {
            panMode = 'swipe';
            modeSwipeBtn.className = 'flex-1 py-2 text-sm font-bold bg-indigo-600 text-white rounded-md shadow transition-colors';
            modeTiltBtn.className = 'flex-1 py-2 text-sm font-medium text-slate-400 hover:text-slate-200 rounded-md transition-colors';
            panSensitivityContainer.style.opacity = '0.4';
            panSensitivityContainer.style.pointerEvents = 'none'; 
        });

        // Wiring Up Sliders
        document.getElementById('deadzone-slider').addEventListener('input', (e) => {
            deadzone = parseFloat(e.target.value);
            document.getElementById('deadzone-val').innerText = `${deadzone.toFixed(1)}°`;
        });
        document.getElementById('pan-slider').addEventListener('input', (e) => {
            panSensitivity = parseFloat(e.target.value);
            document.getElementById('pan-val').innerText = `${panSensitivity.toFixed(1)}x`;
        });
        document.getElementById('zoom-slider').addEventListener('input', (e) => {
            zoomSensitivity = parseFloat(e.target.value);
            document.getElementById('zoom-val').innerText = `${zoomSensitivity.toFixed(1)}x`;
        });

        function calculateBaseSize() {
            if (!img.complete || img.naturalWidth === 0) {
                setTimeout(calculateBaseSize, 50);
                return;
            }
            const scaleFit = Math.max(window.innerWidth / img.naturalWidth, window.innerHeight / img.naturalHeight);
            baseW = img.naturalWidth * scaleFit;
            baseH = img.naturalHeight * scaleFit;
            img.style.width = `${baseW}px`;
            img.style.height = `${baseH}px`;
            updateTransform();
        }

        img.onload = calculateBaseSize;
        window.addEventListener('resize', calculateBaseSize);

        // MUTUALLY EXCLUSIVE TOUCH HANDLING
        function handleTouchStart(e, clientX, clientY) {
            isHolding = true;
            activeGesture = 'none'; 
            
            holdX = clientX;
            holdY = clientY;
            touchStartX = clientX;
            touchStartY = clientY;
            lastTouchX = clientX;
            lastTouchY = clientY;

            if (panMode === 'swipe') {
                modeIndicator.innerHTML = '👆 TOUCHED';
                instructionText.innerText = 'Drag to Pan / Tilt to Zoom';
            } else {
                modeIndicator.innerHTML = '🔍 ZOOM MODE';
                modeIndicator.className = 'bg-amber-500/20 border border-amber-500 text-amber-400 font-bold px-4 py-2 rounded-full backdrop-blur shadow-lg shadow-amber-900/20 transition-colors duration-200';
                instructionText.innerText = 'Release to Pan';
            }
        }

        function handleTouchMove(e, clientX, clientY) {
            if (isHolding && panMode === 'swipe') {
                
                // If we haven't locked in a gesture yet, check distance to see if it's a swipe
                if (activeGesture === 'none') {
                    const dist = Math.hypot(clientX - touchStartX, clientY - touchStartY);
                    if (dist > 10) { 
                        activeGesture = 'pan'; // Lock into panning
                        modeIndicator.innerHTML = '👆 SWIPING';
                        instructionText.innerText = 'Release to reset';
                    }
                }

                // Only execute pan logic if the gesture locked to 'pan'
                if (activeGesture === 'pan') {
                    const dx = clientX - lastTouchX;
                    const dy = clientY - lastTouchY;
                    
                    x += dx;
                    y += dy;
                    
                    vx = 0;
                    vy = 0;
                }

                lastTouchX = clientX;
                lastTouchY = clientY;
                holdX = clientX;
                holdY = clientY;
            }
        }

        function handleTouchEnd() {
            isHolding = false;
            activeGesture = null;
            lastTouchX = null;
            lastTouchY = null;

            modeIndicator.innerHTML = '👁️ PAN MODE';
            modeIndicator.className = 'bg-emerald-500/20 border border-emerald-500 text-emerald-400 font-bold px-4 py-2 rounded-full backdrop-blur shadow-lg shadow-emerald-900/20 transition-colors duration-200';
            instructionText.innerText = panMode === 'swipe' ? 'Touch & Drag to Pan' : 'Press & hold to Zoom';

            if (curBeta !== null && curGamma !== null) {
                baseBeta = curBeta;
                baseGamma = curGamma;
            }
            vx = 0; vy = 0; vs = 0;
        }

        overlay.addEventListener('touchstart', (e) => { e.preventDefault(); handleTouchStart(e, e.touches[0].clientX, e.touches[0].clientY); });
        overlay.addEventListener('touchmove', (e) => { e.preventDefault(); handleTouchMove(e, e.touches[0].clientX, e.touches[0].clientY); });
        overlay.addEventListener('touchend', (e) => { e.preventDefault(); handleTouchEnd(); });
        
        overlay.addEventListener('mousedown', (e) => { handleTouchStart(e, e.clientX, e.clientY); });
        overlay.addEventListener('mousemove', (e) => { handleTouchMove(e, e.clientX, e.clientY); });
        overlay.addEventListener('mouseup', () => { handleTouchEnd(); });
        overlay.addEventListener('mouseleave', () => { handleTouchEnd(); });

        function handleOrientation(event) {
            curBeta = event.beta;   
            curGamma = event.gamma; 
            if (baseBeta === null || baseGamma === null) {
                baseBeta = curBeta;
                baseGamma = curGamma;
            }
        }

        function updateTransform() {
            img.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
        }

        function gameLoop() {
            if (!isRunning) return;

            const ww = window.innerWidth;
            const wh = window.innerHeight;

            if (baseBeta !== null && curBeta !== null) {
                let dBeta = curBeta - baseBeta;
                let dGamma = curGamma - baseGamma;

                if (dBeta > 180) dBeta -= 360;
                if (dBeta < -180) dBeta += 360;
                if (dGamma > 90) dGamma -= 180;
                if (dGamma < -90) dGamma += 180;

                let activeBeta = 0;
                if (Math.abs(dBeta) > deadzone) {
                    activeBeta = dBeta > 0 ? dBeta - deadzone : dBeta + deadzone;
                }

                let activeGamma = 0;
                if (Math.abs(dGamma) > deadzone) {
                    activeGamma = dGamma > 0 ? dGamma - deadzone : dGamma + deadzone;
                }

                if (isHolding) {
                    if (panMode === 'swipe') {
                        // If they tilt the phone BEFORE dragging 10 pixels, lock into zoom
                        if (activeGesture === 'none' && Math.abs(activeBeta) > 0) {
                            activeGesture = 'zoom';
                            modeIndicator.innerHTML = '🔍 ZOOMING';
                            instructionText.innerText = 'Release to reset';
                        }

                        // Only zoom if we haven't locked into a swipe pan
                        if (activeGesture === 'zoom' || activeGesture === 'none') {
                            vs += -activeBeta * (BASE_ZOOM_SPEED * zoomSensitivity);
                        }
                    } else {
                        // Standard tilt mode zoom
                        vs += -activeBeta * (BASE_ZOOM_SPEED * zoomSensitivity);
                    }
                } else if (panMode === 'tilt') {
                    // Standard tilt mode pan
                    vx += (-activeGamma * (BASE_PAN_SPEED * panSensitivity)) / scale;
                    vy += (-activeBeta * (BASE_PAN_SPEED * panSensitivity)) / scale;
                }
            }

            vx *= FRICTION;
            vy *= FRICTION;
            vs *= FRICTION;

            let oldScale = scale;
            scale += vs;
            
            const dynamicMinScale = Math.max(1.0, ww / baseW, wh / baseH);
            scale = Math.max(dynamicMinScale, Math.min(MAX_SCALE, scale));
            const scaleRatio = scale / oldScale;

            if (scaleRatio !== 1) {
                const offsetX = holdX - (ww / 2);
                const offsetY = holdY - (wh / 2);
                x = x * scaleRatio + offsetX * (1 - scaleRatio);
                y = y * scaleRatio + offsetY * (1 - scaleRatio);
            }

            x += vx;
            y += vy;

            const maxPanX = Math.max(0, (baseW * scale - ww) / 2);
            const maxPanY = Math.max(0, (baseH * scale - wh) / 2);

            x = Math.max(-maxPanX, Math.min(maxPanX, x));
            y = Math.max(-maxPanY, Math.min(maxPanY, y));

            if (x === maxPanX || x === -maxPanX) vx = 0;
            if (y === maxPanY || y === -maxPanY) vy = 0;
            if (scale === dynamicMinScale || scale === MAX_SCALE) vs = 0;

            updateTransform();
            requestAnimationFrame(gameLoop);
        }

        async function initGyro() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState !== 'granted') {
                        alert('Gyroscope permission denied.');
                        return;
                    }
                } catch (error) {
                    console.error(error);
                    alert('HTTPS required for gyroscope.');
                    return;
                }
            }

            baseBeta = null;
            baseGamma = null;
            window.addEventListener('deviceorientation', handleOrientation);
            
            setupScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            
            instructionText.innerText = panMode === 'swipe' ? 'Touch & Drag to Pan' : 'Press & hold to Zoom';

            calculateBaseSize();
            isRunning = true;
            requestAnimationFrame(gameLoop);
        }

        function stopGyro() {
            isRunning = false;
            window.removeEventListener('deviceorientation', handleOrientation);
            gameScreen.classList.add('hidden');
            setupScreen.classList.remove('hidden');
        }

        function recalibrate() {
            baseBeta = curBeta;
            baseGamma = curGamma;
            vx = 0; vy = 0; vs = 0;
            document.getElementById('recalibrate-btn').classList.add('bg-indigo-400');
            setTimeout(() => document.getElementById('recalibrate-btn').classList.remove('bg-indigo-400'), 200);
        }

        document.getElementById('start-btn').addEventListener('click', initGyro);
        document.getElementById('back-btn').addEventListener('click', stopGyro);
        document.getElementById('recalibrate-btn').addEventListener('click', recalibrate);

    </script>
</body>
</html>
