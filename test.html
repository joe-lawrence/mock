<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kitchen Gyro Camera Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: none; /* Prevent browser pull-to-refresh */
            user-select: none;
            -webkit-user-select: none;
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #kitchen-img {
            position: absolute;
            transform-origin: center center;
            will-change: transform;
            pointer-events: none;
            
            /* CRITICAL FIX: Overrides Tailwind's default image crunching */
            max-width: none !important;
            max-height: none !important;
        }

        #touch-overlay {
            position: absolute;
            inset: 0;
            z-index: 10;
            cursor: crosshair;
        }

        .slider-thumb::-webkit-slider-thumb {
            appearance: none;
            width: 20px;
            height: 20px;
            background: #6366f1;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- SETTINGS / START SCREEN -->
    <div id="setup-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-slate-900 p-6">
        <h1 class="text-3xl font-bold mb-2 text-indigo-400">Gyro Camera</h1>
        <p class="text-slate-400 mb-8 text-center max-w-md">Find your comfortable resting position, then hit start. The camera will use that exact angle as your "zero" point.</p>
        
        <div class="w-full max-w-sm space-y-6 bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
            
            <!-- Deadzone Slider -->
            <div>
                <div class="flex justify-between mb-1">
                    <label class="text-sm font-medium text-slate-300">Deadzone</label>
                    <span id="deadzone-val" class="text-sm text-indigo-400 font-bold">2.0°</span>
                </div>
                <input type="range" id="deadzone-slider" min="0" max="10" step="0.5" value="2" class="w-full h-2 bg-slate-700 rounded-lg appearance-none slider-thumb">
            </div>

            <button id="start-btn" class="w-full py-3 mt-4 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-bold rounded-lg transition-colors">
                Enable Gyro & Start
            </button>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="hidden absolute inset-0">
        <div id="game-container">
            <img id="kitchen-img" src="new-kitchen.jpeg" alt="Kitchen Scene">
            <div id="touch-overlay"></div>
        </div>

        <!-- HUD -->
        <div class="absolute top-0 left-0 w-full p-4 z-20 flex justify-between items-start pointer-events-none">
            <div class="flex flex-col gap-3 pointer-events-auto">
                <button id="back-btn" class="bg-slate-800/80 backdrop-blur border border-slate-600 text-sm px-4 py-2 rounded-lg hover:bg-slate-700 transition">
                    ← Settings
                </button>
                <button id="recalibrate-btn" class="bg-indigo-600/90 backdrop-blur border border-indigo-500 text-sm px-4 py-2 rounded-lg hover:bg-indigo-500 transition shadow-lg shadow-indigo-900/50">
                    ⌖ Recalibrate
                </button>
            </div>

            <div class="flex flex-col items-end">
                <div id="mode-indicator" class="bg-emerald-500/20 border border-emerald-500 text-emerald-400 font-bold px-4 py-2 rounded-full backdrop-blur transition-colors duration-200">
                    👁️ PAN MODE
                </div>
                <p id="instruction-text" class="text-xs text-slate-300 mt-2 bg-slate-900/50 px-2 py-1 rounded backdrop-blur">
                    Press & hold to Zoom
                </p>
            </div>
        </div>
    </div>

    <script>
        let isRunning = false;
        let isHolding = false;
        
        let baseBeta = null;
        let baseGamma = null;
        let curBeta = null;
        let curGamma = null;

        let x = 0;
        let y = 0;
        let scale = 1.0; 
        
        let vx = 0;
        let vy = 0;
        let vs = 0;

        let deadzone = 2.0; 
        const panSpeed = 0.6;
        const zoomSpeed = 0.005;
        const FRICTION = 0.82; 
        const MAX_SCALE = 4.0; 

        let baseW = 0;
        let baseH = 0;

        const setupScreen = document.getElementById('setup-screen');
        const gameScreen = document.getElementById('game-screen');
        const startBtn = document.getElementById('start-btn');
        const backBtn = document.getElementById('back-btn');
        const recalibrateBtn = document.getElementById('recalibrate-btn');
        const overlay = document.getElementById('touch-overlay');
        const img = document.getElementById('kitchen-img');
        const modeIndicator = document.getElementById('mode-indicator');
        const instructionText = document.getElementById('instruction-text');
        const deadzoneSlider = document.getElementById('deadzone-slider');
        const deadzoneVal = document.getElementById('deadzone-val');

        deadzoneSlider.addEventListener('input', (e) => {
            deadzone = parseFloat(e.target.value);
            deadzoneVal.innerText = `${deadzone.toFixed(1)}°`;
        });

        // 1. GUARANTEE PERFECT ASPECT RATIO ("object-fit: cover" math)
        function calculateBaseSize() {
            if (!img.complete || img.naturalWidth === 0) {
                // If image hasn't loaded yet, try again in 50ms
                setTimeout(calculateBaseSize, 50);
                return;
            }
            
            // Calculate scale required to cover the screen entirely
            const scaleFit = Math.max(window.innerWidth / img.naturalWidth, window.innerHeight / img.naturalHeight);
            
            baseW = img.naturalWidth * scaleFit;
            baseH = img.naturalHeight * scaleFit;

            img.style.width = `${baseW}px`;
            img.style.height = `${baseH}px`;
            
            updateTransform();
        }

        img.onload = calculateBaseSize;
        window.addEventListener('resize', calculateBaseSize);

        function setHoldState(holding) {
            isHolding = holding;
            if (holding) {
                modeIndicator.innerHTML = '🔍 ZOOM MODE';
                modeIndicator.className = 'bg-amber-500/20 border border-amber-500 text-amber-400 font-bold px-4 py-2 rounded-full backdrop-blur shadow-lg shadow-amber-900/20 transition-colors duration-200';
                instructionText.innerText = 'Release to Pan';
            } else {
                modeIndicator.innerHTML = '👁️ PAN MODE';
                modeIndicator.className = 'bg-emerald-500/20 border border-emerald-500 text-emerald-400 font-bold px-4 py-2 rounded-full backdrop-blur shadow-lg shadow-emerald-900/20 transition-colors duration-200';
                instructionText.innerText = 'Press & hold to Zoom';

                // 2. RECALIBRATE ON RELEASE: Prevents jumping when you finish zooming
                if (curBeta !== null && curGamma !== null) {
                    baseBeta = curBeta;
                    baseGamma = curGamma;
                }
                vx = 0; vy = 0; vs = 0;
            }
        }

        overlay.addEventListener('touchstart', (e) => { e.preventDefault(); setHoldState(true); });
        overlay.addEventListener('touchend', (e) => { e.preventDefault(); setHoldState(false); });
        overlay.addEventListener('mousedown', () => { setHoldState(true); });
        overlay.addEventListener('mouseup', () => { setHoldState(false); });
        overlay.addEventListener('mouseleave', () => { setHoldState(false); });

        function handleOrientation(event) {
            curBeta = event.beta;   
            curGamma = event.gamma; 

            if (baseBeta === null || baseGamma === null) {
                baseBeta = curBeta;
                baseGamma = curGamma;
            }
        }

        function updateTransform() {
            img.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
        }

        function gameLoop() {
            if (!isRunning) return;

            // Live window dimensions (handles mobile URL bar hiding)
            const ww = window.innerWidth;
            const wh = window.innerHeight;

            if (baseBeta !== null && curBeta !== null) {
                let dBeta = curBeta - baseBeta;
                let dGamma = curGamma - baseGamma;

                // Handle Gimbal Lock wrap-arounds
                if (dBeta > 180) dBeta -= 360;
                if (dBeta < -180) dBeta += 360;
                if (dGamma > 90) dGamma -= 180;
                if (dGamma < -90) dGamma += 180;

                let activeBeta = 0;
                if (Math.abs(dBeta) > deadzone) {
                    activeBeta = dBeta > 0 ? dBeta - deadzone : dBeta + deadzone;
                }

                let activeGamma = 0;
                if (Math.abs(dGamma) > deadzone) {
                    activeGamma = dGamma > 0 ? dGamma - deadzone : dGamma + deadzone;
                }

                if (isHolding) {
                    // Zoom Mode: Tilt forward/back to zoom. Ignored left/right.
                    vs += -activeBeta * zoomSpeed;
                } else {
                    // 3. NORMALIZED PAN SENSITIVITY: Division by scale keeps speed feeling constant
                    vx += (-activeGamma * panSpeed) / scale;
                    vy += (-activeBeta * panSpeed) / scale;
                }
            }

            x += vx;
            y += vy;
            scale += vs;

            // Apply friction damping
            vx *= FRICTION;
            vy *= FRICTION;
            vs *= FRICTION;

            // 4. DYNAMIC BOUNDARIES & NO BLANK SPACE
            // Ensure minimum scale always covers screen, even if URL bar disappears
            const minScaleW = ww / baseW;
            const minScaleH = wh / baseH;
            const dynamicMinScale = Math.max(1.0, minScaleW, minScaleH);
            
            scale = Math.max(dynamicMinScale, Math.min(MAX_SCALE, scale));

            const maxPanX = Math.max(0, (baseW * scale - ww) / 2);
            const maxPanY = Math.max(0, (baseH * scale - wh) / 2);

            x = Math.max(-maxPanX, Math.min(maxPanX, x));
            y = Math.max(-maxPanY, Math.min(maxPanY, y));

            // Kill velocity upon hitting edges
            if (x === maxPanX || x === -maxPanX) vx = 0;
            if (y === maxPanY || y === -maxPanY) vy = 0;
            if (scale === dynamicMinScale || scale === MAX_SCALE) vs = 0;

            updateTransform();
            requestAnimationFrame(gameLoop);
        }

        async function initGyro() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState !== 'granted') {
                        alert('Gyroscope permission denied.');
                        return;
                    }
                } catch (error) {
                    console.error(error);
                    alert('HTTPS required for gyroscope.');
                    return;
                }
            }

            baseBeta = null;
            baseGamma = null;
            
            window.addEventListener('deviceorientation', handleOrientation);
            
            setupScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            
            calculateBaseSize();

            isRunning = true;
            requestAnimationFrame(gameLoop);
        }

        function stopGyro() {
            isRunning = false;
            window.removeEventListener('deviceorientation', handleOrientation);
            gameScreen.classList.add('hidden');
            setupScreen.classList.remove('hidden');
        }

        function recalibrate() {
            baseBeta = curBeta;
            baseGamma = curGamma;
            
            vx = 0; vy = 0; vs = 0;
            
            recalibrateBtn.classList.add('bg-indigo-400');
            setTimeout(() => recalibrateBtn.classList.remove('bg-indigo-400'), 200);
        }

        startBtn.addEventListener('click', initGyro);
        backBtn.addEventListener('click', stopGyro);
        recalibrateBtn.addEventListener('click', recalibrate);

    </script>
</body>
</html>
